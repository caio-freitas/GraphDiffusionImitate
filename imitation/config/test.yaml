defaults:
  - _self_
  - task: lift_graph
  - policy: gddpm_policy

output_video: False
render: True

seed: 0
num_episodes: 5
max_steps: 500
output_dir: ./outputs

pred_horizon: 16
obs_horizon: 4
action_horizon: 16
action_offset: 0 # action offset for the policy, 1 if first action is to be ignored


agent:
  _target_: imitation.agent.robomimic_lowdim_agent.RobomimicLowdimAgent
  env: ${task.env_runner}